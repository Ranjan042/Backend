apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: express-ingress
  labels:
    app.kubernetes.io/name: express-app
spec:
  ingressClassName: nginx
  rules:
    - host:
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: express-service
                port:
                  number: 80
